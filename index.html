<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="CaspianDentos — калькулятор окупаемости инвестиций для стоматологической клиники. Мгновенный расчёт срока окупаемости пакета." />
<meta name="theme-color" content="#06b6d4" />
<meta property="og:title" content="CaspianDentos · Калькулятор окупаемости" />
<meta property="og:description" content="Считайте срок окупаемости инвестиций в клинику на лету." />
<meta property="og:type" content="website" />
<title>CaspianDentos · Калькулятор окупаемости</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%2306b6d4'/%3E%3Cpath d='M5 17V7l4 4 3-3 4 5' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "framer-motion": "https://esm.sh/framer-motion@11.11.17?external=react"
  }
}
</script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  *{ -webkit-tap-highlight-color:transparent; }
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(1100px 600px at 15% -5%, #ecfeff 0%, transparent 55%),
      radial-gradient(900px 600px at 100% 0%, #f0fdfa 0%, transparent 50%),
      #f8fafc;
    color:#1e293b;
    min-height:100vh;
  }
  .fade-up{ animation:fadeUp .5s cubic-bezier(.16,1,.3,1) both; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

  /* Slider — Stripe-like */
  .cdt-slider{ -webkit-appearance:none; appearance:none; height:6px; border-radius:99px; cursor:pointer; outline:none; }
  .cdt-slider::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%;
    background:#fff; border:2px solid #06b6d4; box-shadow:0 2px 8px rgba(6,182,212,.35);
    transition:transform .15s ease, box-shadow .15s ease; margin-top:0;
  }
  .cdt-slider::-webkit-slider-thumb:hover{ transform:scale(1.12); }
  .cdt-slider::-webkit-slider-thumb:active{ transform:scale(1.05); box-shadow:0 0 0 6px rgba(6,182,212,.15); }
  .cdt-slider::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid #06b6d4;
    box-shadow:0 2px 8px rgba(6,182,212,.35); cursor:pointer;
  }
  .cdt-slider::-moz-range-track{ background:transparent; }
</style>
</head>

<body class="antialiased">
  <main class="mx-auto flex min-h-screen max-w-5xl flex-col items-center justify-center px-4 py-12">
    <div class="fade-up mb-8 text-center">
      <div class="mb-3 inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white/70 px-3.5 py-1.5 text-[12px] font-semibold text-slate-500 backdrop-blur">
        <span class="inline-block h-1.5 w-1.5 rounded-full bg-cyan-500"></span>
        CaspianDentos · Dental OS
      </div>
      <h1 class="text-[28px] font-extrabold tracking-tight text-slate-900 sm:text-[34px]">
        Калькулятор окупаемости
      </h1>
      <p class="mx-auto mt-2 max-w-md text-[15px] leading-relaxed text-slate-500">
        Узнайте, за сколько месяцев окупится инвестиция в клинику.
        Расчёт обновляется мгновенно.
      </p>
    </div>

    <div id="root" class="fade-up w-full flex justify-center" style="animation-delay:.08s"></div>

    <footer class="fade-up mt-10 text-center text-[12px] text-slate-400" style="animation-delay:.16s">
      © <span id="year"></span> CaspianDentos · модуль для Dental OS
    </footer>
  </main>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>

  <script type="text/babel" data-type="module" data-presets="react">
    import { useEffect, useMemo, useState } from "react";
    import { createRoot } from "react-dom/client";
    import { motion, useSpring, AnimatePresence } from "framer-motion";

    /* ── helpers ── */
    const onlyDigits = (s) => String(s).replace(/[^\d]/g, "");

    function AnimatedNumber({ value, decimals = 0, locale = "ru-RU" }) {
      const spring = useSpring(value, { stiffness: 140, damping: 22, mass: 0.7 });
      const [shown, setShown] = useState(value);
      useEffect(() => { spring.set(Number.isFinite(value) ? value : 0); }, [spring, value]);
      useEffect(() => spring.on("change", (v) => setShown(v)), [spring]);
      const text = Number.isFinite(value)
        ? new Intl.NumberFormat(locale, { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(shown)
        : "∞";
      return <span className="tabular-nums">{text}</span>;
    }

    function CurrencyField({ id, label, value, onChange, currency, fmt }) {
      const display = value > 0 ? fmt.format(value) : "";
      return (
        <label htmlFor={id} className="block">
          <span className="mb-2 block text-[12px] font-semibold uppercase tracking-[0.12em] text-slate-400">{label}</span>
          <div className="relative">
            <input
              id={id} inputMode="numeric" autoComplete="off" placeholder="0"
              value={display}
              onChange={(e) => onChange(Number(onlyDigits(e.target.value)))}
              className="w-full rounded-2xl border border-slate-200 bg-white/80 px-4 py-3.5 pr-12 text-[17px] font-semibold text-slate-900 shadow-sm transition-all placeholder:text-slate-300 focus:border-cyan-400 focus:bg-white focus:outline-none focus:ring-4 focus:ring-cyan-500/10"
            />
            <span className="pointer-events-none absolute right-4 top-1/2 -translate-y-1/2 text-[15px] font-medium text-slate-400">{currency}</span>
          </div>
        </label>
      );
    }

    function CaspianDentosROI({
      currency = "₸", locale = "ru-RU",
      defaultCheck = 85000, defaultPackage = 2400000, defaultPerMonth = 12,
    }) {
      const fmt = useMemo(() => new Intl.NumberFormat(locale, { maximumFractionDigits: 0 }), [locale]);
      const [avgCheck, setAvgCheck] = useState(defaultCheck);
      const [pkg, setPkg] = useState(defaultPackage);
      const [perMonth, setPerMonth] = useState(defaultPerMonth);

      const monthlyRevenue = avgCheck * perMonth;
      const months = monthlyRevenue > 0 ? pkg / monthlyRevenue : Infinity;
      const ready = avgCheck > 0 && pkg > 0;
      const years = Math.floor(months / 12);
      const restMonths = months - years * 12;

      const verdict = !ready ? null
        : months <= 6  ? { tone: "emerald", text: "Стремительная окупаемость" }
        : months <= 12 ? { tone: "cyan",    text: "Здоровая динамика" }
        : months <= 24 ? { tone: "amber",   text: "Умеренный горизонт" }
        :                { tone: "slate",   text: "Долгий горизонт" };

      const toneMap = {
        emerald: "bg-emerald-50 text-emerald-600 ring-emerald-500/20",
        cyan:    "bg-cyan-50 text-cyan-600 ring-cyan-500/20",
        amber:   "bg-amber-50 text-amber-600 ring-amber-500/20",
        slate:   "bg-slate-100 text-slate-500 ring-slate-400/20",
      };
      const sliderPct = ((perMonth - 1) / 99) * 100;

      return (
        <div className="w-full max-w-md rounded-[28px] border border-slate-200/70 bg-white/90 p-6 shadow-[0_1px_3px_rgba(15,23,42,.04),0_30px_60px_-30px_rgba(15,23,42,.18)] backdrop-blur sm:p-8">
          <div className="mb-7 flex items-center gap-3">
            <div className="flex h-11 w-11 items-center justify-center rounded-2xl bg-gradient-to-br from-cyan-500 to-teal-500 text-white shadow-lg shadow-cyan-500/25">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M3 3v18h18" /><path d="m7 14 4-4 3 3 5-6" />
              </svg>
            </div>
            <div>
              <h2 className="text-[17px] font-bold leading-tight text-slate-900">Окупаемость инвестиций</h2>
              <p className="text-[12px] text-slate-400">Расчёт на лету · без формул вручную</p>
            </div>
          </div>

          <div className="space-y-5">
            <CurrencyField id="cdt-check" label="Средний чек в клинике" value={avgCheck} onChange={setAvgCheck} currency={currency} fmt={fmt} />
            <CurrencyField id="cdt-package" label="Сумма пакета / инвестиции" value={pkg} onChange={setPkg} currency={currency} fmt={fmt} />

            <div>
              <div className="mb-2 flex items-baseline justify-between">
                <span className="text-[12px] font-semibold uppercase tracking-[0.12em] text-slate-400">Процедур в месяц</span>
                <span className="text-[15px] font-bold tabular-nums text-cyan-600">{perMonth}</span>
              </div>
              <input type="range" min={1} max={100} value={perMonth}
                onChange={(e) => setPerMonth(Number(e.target.value))}
                className="cdt-slider w-full"
                style={{ background: `linear-gradient(to right, #06b6d4 ${sliderPct}%, #e2e8f0 ${sliderPct}%)` }} />
              <div className="mt-1 flex justify-between text-[11px] text-slate-300"><span>1</span><span>100</span></div>
            </div>
          </div>

          <div className="mt-7 overflow-hidden rounded-3xl bg-gradient-to-br from-slate-900 to-slate-800 p-6 text-white">
            <div className="flex items-center justify-between">
              <span className="text-[12px] font-medium uppercase tracking-[0.14em] text-white/50">Срок окупаемости</span>
              <AnimatePresence>
                {verdict && (
                  <motion.span key={verdict.text}
                    initial={{ opacity: 0, y: -4 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 4 }}
                    className={"rounded-full px-2.5 py-1 text-[11px] font-semibold ring-1 " + toneMap[verdict.tone]}>
                    {verdict.text}
                  </motion.span>
                )}
              </AnimatePresence>
            </div>

            <div className="mt-3 flex items-end gap-2">
              {ready ? (
                <>
                  <span className="text-[56px] font-extrabold leading-none tracking-tight">
                    <AnimatedNumber value={months} decimals={1} locale={locale} />
                  </span>
                  <span className="mb-2 text-[18px] font-medium text-white/60">мес.</span>
                </>
              ) : (
                <span className="py-3 text-[18px] font-medium text-white/40">Заполните поля выше</span>
              )}
            </div>

            {ready && Number.isFinite(months) && (
              <div className="mt-4 flex flex-wrap gap-x-6 gap-y-2 border-t border-white/10 pt-4 text-[13px]">
                <div>
                  <div className="text-white/40">≈ в годах</div>
                  <div className="font-semibold tabular-nums">{years > 0 ? years + " г " : ""}{Math.round(restMonths)} мес.</div>
                </div>
                <div>
                  <div className="text-white/40">Выручка / мес.</div>
                  <div className="font-semibold tabular-nums"><AnimatedNumber value={monthlyRevenue} decimals={0} locale={locale} /> {currency}</div>
                </div>
              </div>
            )}
          </div>

          <p className="mt-4 text-center text-[11px] leading-relaxed text-slate-400">
            Формула: сумма пакета ÷ (средний чек × процедуры в месяц).<br />
            Оценка носит ориентировочный характер.
          </p>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<CaspianDentosROI />);
  </script>
</body>
</html>
