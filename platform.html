/* ============================================================
   RBAC — зеркало packages/permissions
   ============================================================ */
const ROLE_COLORS = {
  employee:'bg-slate-100 text-slate-600 border-slate-200', manager:'bg-blue-50 text-blue-700 border-blue-200',
  hr:'bg-teal-50 text-teal-700 border-teal-200', accountant:'bg-amber-50 text-amber-700 border-amber-200',
  admin:'bg-violet-50 text-violet-700 border-violet-200', director:'bg-cyan-50 text-cyan-700 border-cyan-200',
  partner:'bg-slate-900 text-white border-slate-900'
};
const FULL_ACCESS = ['director','partner'];
const EXEC_RESTRICTED = ['analytics','payroll_totals','exports','executive_dashboard'];
const MATRIX = {
  employee:   ['timeclock','timesheet:own','checklist','tasks:own','payslip:own','leaves:own'],
  manager:    ['timeclock','timesheet:team','checklist','tasks','leaves:approve','team','employees:read'],
  hr:         ['employees','leaves:approve','timesheet:all','payslip:all','tasks'],
  accountant: ['payroll','payslip:all','timesheet:all','employees:read'],
  admin:      ['bookings','employees:read','leaves:read','timesheet:all'],
  director:   ['*'], partner:['*'],
};
const isFull = r => FULL_ACCESS.includes(r);
function can(resource){
  const role = session().role;
  if(isFull(role)) return true;
  if(EXEC_RESTRICTED.includes(resource)) return false;
  const g = MATRIX[role]||[];
  return g.includes(resource) || g.some(x=>x.split(':')[0]===resource);
}
const canApprove = () => isFull(session().role) || ['manager','hr'].includes(session().role);
const canVerify  = () => isFull(session().role) || session().role==='manager';

/* ============================================================
   STORAGE / SESSION
   ============================================================ */
const LS={session:'cp_session',shift:'cp_shift',att:'cp_att',leaves:'cp_leaves',chk:'cp_chk',tasks:'cp_tasks'};
const get=(k,d)=>{ try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;} };
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const session=()=>get(LS.session,null);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KZT=n=>Number(n).toLocaleString('ru-RU')+' ₸';

const RATE=3500;
const TEAM=[
  {name:'Иван Сотрудник',role:'employee',hours:168,rate:3500},
  {name:'Мария Гигиенист',role:'employee',hours:152,rate:3800},
  {name:'Данияр Ассистент',role:'employee',hours:174,rate:3200},
  {name:'Сауле Админ',role:'admin',hours:160,rate:4000},
];
const SERVICES=[['hygiene',42],['implant',31],['whitening',27],['ortho',19],['consult',15]];

/* ============================================================
   LANG
   ============================================================ */
function applyStaticTexts(){
  document.documentElement.lang = lang.toLowerCase();
  document.getElementById('demo-badge').textContent = t('demo_badge');
  document.getElementById('lang-btn-login').textContent = lang;
  const set1=(id,v)=>{const e=document.getElementById(id); if(e)e.textContent=v;};
  set1('t-login-title',t('login_title')); set1('t-login-sub',t('login_sub'));
  set1('t-phone-label',t('phone_label')); set1('t-get-code',t('get_code'));
  set1('t-otp-label',t('otp_label')); set1('t-otp-hint',t('otp_hint')); set1('t-enter',t('enter'));
  set1('t-quick',t('quick')); set1('t-rbac-note',t('rbac_note'));
  const lb=document.getElementById('lang-btn'); if(lb) lb.textContent=lang;
  renderRoleGrid();
}
function toggleLang(){ lang = lang==='RU'?'KZ':'RU'; localStorage.setItem('cp_lang',lang); applyStaticTexts();
  if(session() && !document.getElementById('app').classList.contains('hidden')){ buildNav(); navigate(current); } }

/* ============================================================
   AUTH
   ============================================================ */
function renderRoleGrid(){
  document.getElementById('role-grid').innerHTML = Object.keys(I18N[lang].roles).map(r=>
    `<button onclick="loginAs('${r}')" class="px-3 py-2.5 rounded-xl border text-sm font-medium hover:border-cyan-400 transition-all text-left ${ROLE_COLORS[r]}">${t('roles')[r]||I18N[lang].roles[r]}</button>`
  ).join('');
}
function sendOtp(){ document.getElementById('step-phone').classList.add('hidden'); document.getElementById('step-otp').classList.remove('hidden'); toast(t('otp_sent')); }
function verifyOtp(){ if(document.getElementById('otp').value.trim().length<4){ toast(t('enter4')); return; } loginAs('employee'); }
function loginAs(role){
  set(LS.session,{role, phone:document.getElementById('phone').value});
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  buildNav(); navigate(defaultView()); lucide.createIcons();
}
function logout(){ localStorage.removeItem(LS.session); location.reload(); }
const roleLabel = r => I18N[lang].roles[r];

/* ============================================================
   NAV
   ============================================================ */
const NAV=[
  {id:'dashboard',icon:'layout-dashboard',res:null},
  {id:'timeclock',icon:'timer',res:'timeclock'},
  {id:'timesheet',icon:'clock',res:'timesheet'},
  {id:'checklist',icon:'list-checks',res:'checklist'},
  {id:'tasks',icon:'check-square',res:'tasks'},
  {id:'leaves',icon:'plane',res:'leaves'},
  {id:'team',icon:'users',res:'team'},
  {id:'employees',icon:'contact',res:'employees'},
  {id:'payslip',icon:'receipt',res:'payslip'},
  {id:'payroll',icon:'banknote',res:'payroll'},
  {id:'analytics',icon:'bar-chart-3',res:'analytics'},
  {id:'executive',icon:'gem',res:'executive_dashboard'},
  {id:'admin',icon:'settings',res:'bookings'},
];
const visibleNav=()=>NAV.filter(n=>n.res===null||can(n.res));
const defaultView=()=>visibleNav()[0]?.id||'dashboard';
function buildNav(){
  const s=session();
  document.getElementById('role-chip').className='px-3 py-1.5 rounded-lg text-xs font-semibold border '+ROLE_COLORS[s.role];
  document.getElementById('role-chip').textContent=roleLabel(s.role);
  document.getElementById('lang-btn').textContent=lang;
  document.getElementById('nav').innerHTML=visibleNav().map(n=>
    `<button data-nav="${n.id}" onclick="navigate('${n.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-slate-600 hover:bg-slate-50 transition-all"><i data-lucide="${n.icon}" class="w-4 h-4"></i>${tn(n.id)}</button>`).join('');
  lucide.createIcons();
}
let current='dashboard';
function navigate(id){
  const item=NAV.find(n=>n.id===id);
  if(item&&item.res&&!can(item.res)){ renderDenied(); return; }
  current=id;
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('nav-active',b.getAttribute('data-nav')===id));
  ({dashboard:renderDashboard,timeclock:renderTimeclock,timesheet:renderTimesheet,checklist:renderChecklist,
    tasks:renderTasks,leaves:renderLeaves,team:renderTeam,employees:renderEmployees,payslip:renderPayslip,
    payroll:renderPayroll,analytics:renderAnalytics,executive:renderExecutive,admin:renderAdmin}[id]||renderDashboard)();
  lucide.createIcons();
}
function setMain(h){ document.getElementById('main').innerHTML=`<div class="fade-in">${h}</div>`; }
function H(t1,sub){ return `<div class="mb-6"><h1 class="text-2xl font-bold tracking-tight text-slate-900">${t1}</h1>${sub?`<p class="text-slate-500 text-sm mt-1">${sub}</p>`:''}</div>`; }
function card(i,c=''){ return `<div class="bg-white rounded-2xl border border-slate-200 card p-6 ${c}">${i}</div>`; }
function kpi(l,v,ic,col){ return card(`<div class="flex items-center justify-between"><span class="text-xs text-slate-400 font-medium">${l}</span><i data-lucide="${ic}" class="w-4 h-4 ${col}"></i></div><p class="mt-2 text-2xl font-extrabold text-slate-900">${v}</p>`); }
function renderDenied(){ setMain(card(`<div class="text-center py-10"><i data-lucide="shield-x" class="w-10 h-10 text-rose-400 mx-auto"></i><p class="mt-3 font-semibold text-slate-800">${t('denied_t')}</p><p class="text-sm text-slate-500 mt-1">${t('denied_s').replace('{role}',roleLabel(session().role))}</p></div>`)); lucide.createIcons(); }

/* ============================================================
   VIEWS
   ============================================================ */
function renderDashboard(){
  const s=session(), sh=get(LS.shift,null), c=[];
  c.push(kpi(t('kShiftStatus'), sh?t('onShift'):t('offShift'),'timer','text-cyan-600'));
  if(can('timesheet')) c.push(kpi(t('kHoursMonth'),'168 ч','clock','text-blue-500'));
  if(can('payslip')||can('payroll')) c.push(kpi(can('payroll')?t('kFotNet'):t('kSalaryNet'), can('payroll')?KZT(7650000):KZT(168*RATE),'banknote','text-emerald-500'));
  if(can('analytics')) c.push(kpi(t('kBookingsMonth'),'134','calendar-check','text-violet-500'));
  if(can('employees')||can('team')) c.push(kpi(t('kEmployees'),TEAM.length,'users','text-teal-500'));
  let box='';
  if(s.role==='admin') box=card(`<div class="flex items-start gap-3"><i data-lucide="shield" class="w-5 h-5 text-violet-500 mt-0.5"></i><div><p class="font-semibold text-slate-800 text-sm">${t('adminBoxT')}</p><p class="text-sm text-slate-500 mt-1">${t('adminBoxS')}</p></div></div>`,'mt-6 border-violet-200 bg-violet-50/40');
  setMain(H(t('welcome')+', '+roleLabel(s.role), t('overview'))+`<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${c.join('')}</div>`+box);
}
function renderTimeclock(){
  const sh=get(LS.shift,null), el=sh?Math.floor((Date.now()-sh.start)/1000):0;
  const f=n=>String(n).padStart(2,'0'), hh=f(Math.floor(el/3600)),mm=f(Math.floor(el%3600/60)),ss=f(el%60);
  setMain(H(t('shift_t'),t('shift_s'))+card(`<div class="text-center py-6">
    <div class="text-5xl font-extrabold font-mono tracking-tight ${sh?'text-cyan-600':'text-slate-300'}" id="st">${hh}:${mm}:${ss}</div>
    <p class="text-sm text-slate-500 mt-2">${sh?(t('shift_started_at')+' '+new Date(sh.start).toLocaleTimeString('ru-RU')):t('shift_not')}</p>
    <button onclick="toggleShift()" class="mt-6 px-8 py-4 rounded-2xl font-bold text-white transition-all ${sh?'bg-rose-500 hover:bg-rose-600':'bg-cyan-600 hover:bg-cyan-700'}">${sh?t('stop_shift'):t('start_shift')}</button>
    <div class="mt-6 grid grid-cols-3 gap-3 max-w-md mx-auto text-center">
      <div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-400">${t('today')}</div><div class="font-bold text-slate-800">${sh?(hh+'ч '+mm+'м'):'0ч 00м'}</div></div>
      <div class="rounded-xl bg-slate-50 p-3"><div class="text-xs text-slate-400">${t('week')}</div><div class="font-bold text-slate-800">38ч 20м</div></div>
      <div class="rounded-xl bg-amber-50 p-3"><div class="text-xs text-amber-600">${t('overtime')}</div><div class="font-bold text-amber-700">2ч 15м</div></div>
    </div></div>`));
  if(sh){ clearInterval(window._st); window._st=setInterval(()=>{const e=document.getElementById('st'); if(!e){clearInterval(window._st);return;} const x=Math.floor((Date.now()-sh.start)/1000); e.textContent=[Math.floor(x/3600),Math.floor(x%3600/60),x%60].map(f).join(':');},1000); }
}
function toggleShift(){
  const sh=get(LS.shift,null);
  if(sh){ const m=Math.round((Date.now()-sh.start)/60000); const l=get(LS.att,[]); l.unshift({date:new Date().toISOString().slice(0,10),mins:m,ot:Math.max(0,m-480)}); set(LS.att,l); localStorage.removeItem(LS.shift); toast(t('shift_ended')+': '+(m/60).toFixed(1)+' ч'); }
  else { set(LS.shift,{start:Date.now()}); toast(t('shift_started')); }
  renderTimeclock(); lucide.createIcons();
}
function renderTimesheet(){
  const log=get(LS.att,[]); const rows=(log.length?log:[{date:'2026-05-28',mins:505,ot:25},{date:'2026-05-27',mins:480,ot:0},{date:'2026-05-26',mins:530,ot:50},{date:'2026-05-25',mins:465,ot:0}])
    .map(r=>`<tr class="border-t border-slate-100"><td class="px-4 py-3">${esc(r.date)}</td><td class="px-4 py-3 font-medium">${(r.mins/60).toFixed(1)} ч</td><td class="px-4 py-3 ${r.ot?'text-amber-600 font-semibold':'text-slate-400'}">${r.ot?((r.ot/60).toFixed(1)+' ч'):'—'}</td><td class="px-4 py-3"><span class="text-emerald-600 text-xs font-medium">${t('verified')}</span></td></tr>`).join('');
  const own = can('timesheet') && !can('payroll') && !['hr','admin'].includes(session().role);
  setMain(H(t('ts_t'), own?t('ts_s_own'):t('ts_s_all'))+card(tbl([t('th_date'),t('th_hours'),t('th_ot'),t('th_status')],rows)));
}
function tbl(heads,rows){ return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="text-slate-400 text-xs uppercase"><tr>${heads.map(h=>`<th class="px-4 py-2 text-left">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`; }

function renderChecklist(){
  const items=get(LS.chk,[
    {id:1,txt:'Стерилизация инструментов',done:true},{id:2,txt:'Проверка оборудования и кресла',done:true},
    {id:3,txt:'Подготовка расходных материалов',done:false},{id:4,txt:'Сверка расписания на день',done:false},
    {id:5,txt:'Уборка и дезинфекция кабинета (закрытие)',done:false},
  ]);
  const done=items.filter(i=>i.done).length, pct=Math.round(done/items.length*100);
  const rows=items.map(i=>`<div class="flex items-center gap-3 py-2.5 border-b border-slate-100 last:border-0">
    <input type="checkbox" class="chk hidden" id="ci${i.id}" ${i.done?'checked':''} onchange="toggleChk(${i.id})">
    <label for="ci${i.id}" class="flex items-center gap-3 cursor-pointer flex-1"><span class="box w-5 h-5 rounded-md border-2 border-slate-300 flex items-center justify-center transition-all"><i data-lucide="check" class="w-3.5 h-3.5 text-white opacity-0"></i></span><span class="text-sm ${i.done?'text-slate-400 line-through':'text-slate-700'}">${esc(i.txt)}</span></label></div>`).join('');
  setMain(H(t('chk_t'),t('chk_s'))+card(`<div class="flex items-center justify-between mb-4"><span class="text-sm font-semibold text-slate-700">${done}/${items.length} ${t('chk_done')}</span><span class="text-sm font-bold text-cyan-600">${pct}%</span></div><div class="h-2 bg-slate-100 rounded-full overflow-hidden mb-5"><div class="bar h-full bg-cyan-500 rounded-full" style="width:${pct}%"></div></div>${rows}${canVerify()?`<button onclick="toast(t('chk_verified'))" class="mt-5 w-full py-2.5 rounded-xl bg-cyan-50 text-cyan-700 text-sm font-semibold hover:bg-cyan-100">${t('chk_verify')}</button>`:''}`));
}
function toggleChk(id){ const it=get(LS.chk,null)|| [{id:1,txt:'Стерилизация инструментов',done:true},{id:2,txt:'Проверка оборудования и кресла',done:true},{id:3,txt:'Подготовка расходных материалов',done:false},{id:4,txt:'Сверка расписания на день',done:false},{id:5,txt:'Уборка и дезинфекция кабинета (закрытие)',done:false}]; const x=it.find(i=>i.id===id); if(x)x.done=!x.done; set(LS.chk,it); renderChecklist(); lucide.createIcons(); }

function renderTasks(){
  const tasks=get(LS.tasks,[
    {id:1,txt:'Принять пациента 14:00 (имплантация)',status:'doing'},
    {id:2,txt:'Заказать расходники у поставщика',status:'todo'},
    {id:3,txt:'Заполнить карту пациента №134',status:'done'},
    {id:4,txt:'Подтвердить запись на завтра',status:'todo'},
  ]);
  const stMeta={todo:['st_todo','bg-slate-100 text-slate-600'],doing:['st_doing','bg-amber-50 text-amber-700'],done:['st_done','bg-emerald-50 text-emerald-700']};
  const rows=tasks.map(tk=>{const [lk,cl]=stMeta[tk.status]; return `<div class="flex items-center justify-between gap-3 py-3 border-b border-slate-100 last:border-0">
    <span class="text-sm ${tk.status==='done'?'text-slate-400 line-through':'text-slate-700'}">${esc(tk.txt)}</span>
    <div class="flex items-center gap-2 shrink-0"><span class="px-2.5 py-1 rounded-lg text-xs font-medium ${cl}">${t(lk)}</span>
    ${tk.status!=='done'?`<button onclick="advTask(${tk.id})" title="${t('task_adv')}" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-500 hover:text-cyan-600 hover:border-cyan-300 flex items-center justify-center"><i data-lucide="arrow-right" class="w-4 h-4"></i></button>`:(canVerify()?`<span class="text-emerald-600 text-xs font-semibold">${t('task_verify')} ✓</span>`:'')}</div></div>`;}).join('');
  setMain(H(t('tasks_t'),t('tasks_s'))+card(rows));
}
function advTask(id){ const ts=get(LS.tasks,null)||[{id:1,txt:'Принять пациента 14:00 (имплантация)',status:'doing'},{id:2,txt:'Заказать расходники у поставщика',status:'todo'},{id:3,txt:'Заполнить карту пациента №134',status:'done'},{id:4,txt:'Подтвердить запись на завтра',status:'todo'}]; const x=ts.find(i=>i.id===id); if(x)x.status=x.status==='todo'?'doing':'done'; set(LS.tasks,ts); renderTasks(); lucide.createIcons(); }

function renderLeaves(){
  const leaves=get(LS.leaves,[
    {id:1,who:'Иван Сотрудник',type:'vac',from:'2026-06-10',to:'2026-06-20',status:'pending'},
    {id:2,who:'Мария Гигиенист',type:'sick',from:'2026-05-29',to:'2026-05-31',status:'approved'},
    {id:3,who:'Данияр Ассистент',type:'trip',from:'2026-06-02',to:'2026-06-04',status:'pending'},
  ]);
  const typeL={vac:'lv_vac',sick:'lv_sick',trip:'lv_trip'}, stL={pending:'st_pending',approved:'st_approved',rejected:'st_rejected'};
  const ap=canApprove();
  const rows=leaves.map(l=>`<tr class="border-t border-slate-100"><td class="px-4 py-3 font-medium">${esc(l.who)}</td><td class="px-4 py-3">${t(typeL[l.type])}</td><td class="px-4 py-3 text-slate-500">${l.from} → ${l.to}</td><td class="px-4 py-3 text-xs font-semibold ${l.status==='approved'?'text-emerald-600':l.status==='rejected'?'text-rose-500':'text-amber-600'}">${t(stL[l.status])}</td><td class="px-4 py-3 text-right">${(ap&&l.status==='pending')?`<button onclick="approveLeave(${l.id})" class="px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 text-xs font-medium hover:bg-emerald-100">${t('approve')}</button>`:'<span class="text-slate-300 text-xs">—</span>'}</td></tr>`).join('');
  setMain(H(t('leaves_t'),t('leaves_s'))+`<div class="flex justify-end mb-3"><button onclick="newLeave()" class="px-4 py-2.5 rounded-xl bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-semibold flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4"></i>${t('new_leave')}</button></div>`+card(tbl([t('th_emp'),t('th_type'),t('th_period'),t('th_status'),''],rows)));
}
function newLeave(){ const l=get(LS.leaves,[]); l.unshift({id:Date.now(),who:roleLabel(session().role),type:'vac',from:'2026-06-15',to:'2026-06-22',status:'pending'}); set(LS.leaves,l); toast(t('leave_created')); renderLeaves(); lucide.createIcons(); }
function approveLeave(id){ const l=get(LS.leaves,[]); const x=l.find(i=>i.id===id); if(x)x.status='approved'; set(LS.leaves,l); toast(t('leave_approved')); renderLeaves(); lucide.createIcons(); }

function renderTeam(){
  const rows=TEAM.map(m=>`<tr class="border-t border-slate-100"><td class="px-4 py-3 font-medium">${esc(m.name)}</td><td class="px-4 py-3 text-slate-500">${roleLabel(m.role)}</td><td class="px-4 py-3">${m.hours} ч</td><td class="px-4 py-3"><button class="px-3 py-1.5 rounded-lg bg-cyan-50 text-cyan-700 text-xs font-medium hover:bg-cyan-100" onclick="toast(t('hours_verified')+' ${esc(m.name)}')">${t('verify_hours')}</button></td></tr>`).join('');
  setMain(H(t('team_t'),t('team_s'))+card(tbl([t('th_emp'),t('th_role'),t('th_hpm'),t('th_action')],rows)));
}
function renderEmployees(){
  const showRate=can('payroll')||isFull(session().role);
  const rows=TEAM.map(m=>`<tr class="border-t border-slate-100"><td class="px-4 py-3 font-medium">${esc(m.name)}</td><td class="px-4 py-3 text-slate-500">${roleLabel(m.role)}</td><td class="px-4 py-3">${m.hours} ч</td><td class="px-4 py-3 text-slate-400">${showRate?KZT(m.rate)+'/час':t('hidden')}</td></tr>`).join('');
  setMain(H(t('emp_t'),t('emp_s'))+card(tbl(['ФИО',t('th_role'),t('th_hpm'),t('th_rate')],rows)));
}
function renderPayslip(){
  const h=168,g=h*RATE,tax=Math.round(g*0.1),net=g-tax;
  const row=(l,v,c='')=>`<div class="flex justify-between py-2 border-b border-slate-100"><span class="text-slate-500">${l}</span><span class="font-semibold ${c}">${v}</span></div>`;
  setMain(H(t('ps_t'),t('ps_s'))+card(`<div class="max-w-md">${row(t('ps_hours'),h+' ч')}${row(t('ps_rate'),KZT(RATE)+'/час')}${row(t('ps_gross'),KZT(g))}${row(t('ps_tax'),'−'+KZT(tax),'text-rose-500')}<div class="flex justify-between py-3 mt-1"><span class="font-bold text-slate-800">${t('ps_net')}</span><span class="font-extrabold text-emerald-600 text-lg">${KZT(net)}</span></div></div>`));
}
function renderPayroll(){
  const rows=TEAM.map(m=>{const g=m.hours*m.rate,n=Math.round(g*0.9); return `<tr class="border-t border-slate-100"><td class="px-4 py-3 font-medium">${esc(m.name)}</td><td class="px-4 py-3">${m.hours} ч</td><td class="px-4 py-3">${KZT(m.rate)}</td><td class="px-4 py-3">${KZT(g)}</td><td class="px-4 py-3 font-semibold text-emerald-600">${KZT(n)}</td></tr>`;}).join('');
  const tg=TEAM.reduce((a,m)=>a+m.hours*m.rate,0),tn=Math.round(tg*0.9);
  setMain(H(t('pr_t'),t('pr_s'))+`<div class="grid grid-cols-2 lg:grid-cols-3 gap-4 mb-6">${kpi(t('kEmployees'),TEAM.length,'users','text-cyan-600')}${kpi(t('pr_fot_g'),KZT(tg),'banknote','text-blue-500')}${kpi(t('pr_fot_n'),KZT(tn),'wallet','text-emerald-500')}</div>`+card(tbl([t('th_emp'),t('th_hours'),t('th_rate'),t('ps_gross'),t('ps_net')],rows)));
}
function barChart(data,labelFn,grad){ const max=Math.max(...data.map(d=>d[1])); return `<div class="space-y-3">${data.map(([k,v])=>`<div><div class="flex justify-between text-xs mb-1"><span class="text-slate-600 font-medium">${labelFn(k)}</span><span class="text-slate-400 font-semibold">${v}</span></div><div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div class="bar h-full rounded-full ${grad}" style="width:${v/max*100}%"></div></div></div>`).join('')}</div>`; }
function renderAnalytics(){
  setMain(H(t('an_t'),t('an_s'))+`<div class="grid lg:grid-cols-2 gap-6">${card('<h3 class="text-sm font-bold text-slate-900 mb-4">'+t('an_services')+'</h3>'+barChart(SERVICES,k=>t('svc')[k],'bg-gradient-to-r from-cyan-500 to-teal-400'))}${card('<h3 class="text-sm font-bold text-slate-900 mb-4">'+t('an_byemp')+'</h3>'+barChart(TEAM.map(m=>[m.name,m.hours]),k=>esc(k),'bg-gradient-to-r from-violet-500 to-fuchsia-400'))}</div>`);
}
function renderExecutive(){
  setMain(H(t('ex_t'),t('ex_s'))+
    `<div class="flex justify-end mb-4"><button onclick="toast(t('exported'))" class="px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold flex items-center gap-2"><i data-lucide="download" class="w-4 h-4"></i>${t('export')}</button></div>`+
    `<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">${kpi(t('revenue'),KZT(4200000),'trending-up','text-emerald-500')}${kpi(t('profit'),KZT(1450000),'piggy-bank','text-cyan-600')}${kpi(t('load'),'78%','activity','text-blue-500')}${kpi(t('retention'),'91%','heart','text-rose-500')}</div>`+
    `<div class="grid lg:grid-cols-2 gap-6">${card('<h3 class="text-sm font-bold text-slate-900 mb-4">'+t('an_services')+'</h3>'+barChart(SERVICES,k=>t('svc')[k],'bg-gradient-to-r from-cyan-500 to-teal-400'))}${card('<h3 class="text-sm font-bold text-slate-900 mb-4">'+t('pr_t')+'</h3>'+barChart(TEAM.map(m=>[m.name,Math.round(m.hours*m.rate*0.9/1000)]),k=>esc(k),'bg-gradient-to-r from-emerald-500 to-teal-400'))}</div>`);
}
function renderAdmin(){
  const b=['09:00 — Алихан С.','11:00 — Елена П.','14:00 — Нурлан А.'].map(x=>`<div class="flex items-center justify-between px-3 py-2 rounded-lg bg-slate-50"><span>${x}</span><span class="text-emerald-600 text-xs font-medium">${t('active')}</span></div>`).join('');
  setMain(H(t('admin_t'),t('admin_s'))+`<div class="grid lg:grid-cols-2 gap-6">${card('<h3 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2"><i data-lucide="calendar-plus" class="w-4 h-4 text-cyan-600"></i>'+t('today_bookings')+'</h3><div class="space-y-2 text-sm">'+b+'</div>')}${card('<h3 class="text-sm font-bold text-slate-900 mb-3 flex items-center gap-2"><i data-lucide="shield" class="w-4 h-4 text-violet-500"></i>'+t('role_bounds')+'</h3><p class="text-sm text-slate-500 leading-relaxed">'+t('admin_bounds')+'</p>')}</div>`);
}

let toastT;
function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.style.opacity='1'; e.style.transform='translateX(-50%) translateY(0)'; clearTimeout(toastT); toastT=setTimeout(()=>{e.style.opacity='0';e.style.transform='translateX(-50%) translateY(-12px)';},2600); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('hidden'); }
function tickClock(){ const c=document.getElementById('clock'); if(c)c.textContent=new Date().toLocaleTimeString('ru-RU'); }

applyStaticTexts();
setInterval(tickClock,1000); tickClock();
if(session()){ document.getElementById('login').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); buildNav(); navigate(defaultView()); }
lucide.createIcons();
